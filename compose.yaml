services:
  sunrayd:
    image: ghcr.io/bi119ate5hxk/sunray2server:latest
    pull_policy: always
    # Required for the Sun Ray's TCP control channel and dynamic bidirectional
    # UDP display channel. On Docker Desktop, first enable host networking in
    # Settings > Resources > Network, then Apply & Restart.
    network_mode: host
    restart: unless-stopped
    secrets:
      - source: vnc_password
        target: vnc_password
    command:
      - -config
      - /etc/sunray/config.yaml
      - -debug
    volumes:
      - type: bind
        source: ${SUNRAY_CONFIG:-./config.yaml.template}
        target: /etc/sunray/config.yaml
        read_only: true
      - type: bind
        source: ${SUNRAY_ASSETS_DIR:-./assets}
        target: /etc/sunray/assets
        read_only: true

secrets:
  vnc_password:
    file: ${SUNRAY_VNC_PASSWORD_FILE:-./secrets/vnc_password.template}
